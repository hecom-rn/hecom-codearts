name: temp-copy-npm-token

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt org NPM_TOKEN with Authority repo public key
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          AUTHORITY_PK: "LrRovl7Dl95f1CNEzpT9sdr8MFbncjtpx8RqmFQE0Tk="
        run: |
          set -e
          d=$(mktemp -d); cd "$d"
          python3 -m venv v
          ./v/bin/pip -q install pynacl
          ./v/bin/python - <<'EOF'
          import base64, os, sys
          from nacl.public import PublicKey, SealedBox
          token = os.environ.get("NPM_TOKEN", "")
          if not token:
              sys.exit("NPM_TOKEN is empty")
          sealed = SealedBox(PublicKey(base64.b64decode(os.environ["AUTHORITY_PK"]))).encrypt(token.encode())
          print("ENCRYPTED:" + base64.b64encode(sealed).decode())
          EOF
